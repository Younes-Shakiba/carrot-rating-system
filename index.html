<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrot Rating System</title>
    <script src="https://unpkg.com/@rive-app/webgl2@latest"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #262626;
        padding: 1rem;
      }

      /* Container controls maximum desktop size and responsiveness */
      .canvas-container {
        width: 100%;
        max-width: 500px;
        aspect-ratio: 1 / 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="canvas-container">
      <canvas id="canvas"></canvas>
    </div>

    <script>
      const r = new rive.Rive({
        src: "./carrot-rating-system.riv",
        canvas: document.getElementById("canvas"),
        autoplay: true,
        autoBind: true,
        stateMachine: "State Machine 1",
        // Tells Rive how to fit the artboard into the responsive canvas
        layout: new rive.Layout({
          fit: rive.Fit.Contain,
          alignment: rive.Alignment.Center,
        }),
        onLoad: () => {
          r.resizeDrawingSurfaceToCanvas();
        },
      });

      // Recalculate canvas resolution on window resize
      window.addEventListener("resize", () => {
        r.resizeDrawingSurfaceToCanvas();
      });
    </script>
  </body>
</html>
